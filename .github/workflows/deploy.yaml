name: Authentication Service CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: check docker
        run: docker --version

      - name: build Image
        run: docker build -t authentication-service .


  deploy:
    needs: test
    runs-on: ubuntu-latest

    env:
      EC2_HOST: 13.201.89.75

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

      - name: Add EC2 host to known hosts
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test EC2 SSH connection
        run: |
          ssh -i ~/.ssh/ec2_deploy_key \
            ec2-user@"$EC2_HOST" \
            "echo 'GitHub Actions successfully connected to EC2'"